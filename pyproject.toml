[project]
name = "beanprice-eodhd"
version = "0.1.0"
description = "beanprice source for eodhd.com's end-of-day price API"
readme = "README.md"
license = "CC0-1.0"
requires-python = ">=3.11"
dependencies = [
    "beanprice",
    "requests>=2.31",
]

[tool.uv.sources]
beanprice = { git = "https://github.com/beancount/beanprice.git" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/beanprice_eodhd"]

[dependency-groups]
dev = ["pytest>=9.1.1", "pylint>=4.0.8"]
